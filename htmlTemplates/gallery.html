<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MuseMatch Gallery</title>
    <link rel="stylesheet" href="../CSS/styles.css" />
  </head>
  <body>
    <!-- Navigation -->
    <nav class="gallery-nav">
      <a href="#" class="nav-brand">MuseMatch</a>
      <div class="nav-actions">
        <a href="login.html" class="btn-gallery btn-gallery-outline">Login</a>
        <a href="register.html" class="btn-gallery btn-gallery-solid">Register</a>
      </div>
    </nav>

    <!-- Simple Tour Guide HUD Overlay -->
    <div id="tour-guide-hud">
      <h2 id="guide-status">Walk up to a painting to hear the guide...</h2>
      <p id="artwork-info"></p>
    </div>

    <!-- The Horizontal Hallway -->
    <div class="gallery-wrapper">
      <div id="gallery-hallway" class="hallway">
        <!-- Artworks will be injected here dynamically -->
      </div>
    </div>
            <nav class="mt-2">
                <ul
                  class="pagination pagination-sm justify-content-center mb-0"
                  id="fungiPagination"
                >
                  <!-- Rendered dynamically -->
                </ul>
              </nav>

    <!-- Request Artwork Modal -->
    <div id="request-modal" class="modal-overlay" style="display:none;">
      <div class="modal-card">
        <button class="modal-close" id="modal-close-btn">&#x2715;</button>
        <h2 class="modal-title">Request Artwork</h2>
        <p id="modal-art-title" class="modal-subtitle"></p>

        <div id="modal-error" class="auth-error" style="display:none;"></div>

        <div class="form-group">
          <label for="modal-budget">Your Budget</label>
          <select id="modal-budget" class="modal-select">
            <option value="50">$50</option>
            <option value="100">$100</option>
            <option value="200">$200</option>
            <option value="300">$300</option>
            <option value="400">$400</option>
            <option value="500+">$500+</option>
          </select>
        </div>

        <button id="modal-submit-btn" class="auth-submit" style="margin-top:8px;">Send Request</button>
      </div>
    </div>

    <script src="../JS/auth.js"></script>
    <script>Auth.updateNav();</script>
    <script src="../JS/app.js"></script>
  </body>
</html>
