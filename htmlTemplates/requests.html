<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MuseMatch — Commission Requests</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Tenor+Sans&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #0c0a08;
        --bg2: #131109;
        --gold: #c9a84c;
        --gold-dim: #7a6330;
        --cream: #f2ead8;
        --cream-dim: #a09070;
        --panel: rgba(20, 17, 10, 0.97);
        --shadow: rgba(0,0,0,0.75);
        --frame-outer: #3a2e18;
        --frame-inner: #5c4820;
        --frame-line: #c9a84c;
        --err: #c0392b;
        --success: #6aad7a;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background: var(--bg);
        color: var(--cream);
        font-family: 'Tenor Sans', sans-serif;
        min-height: 100vh;
        overflow-x: hidden;
        cursor: crosshair;
      }

      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background:
          radial-gradient(ellipse 80% 50% at 50% 110%, #2a1f08 0%, transparent 70%),
          repeating-linear-gradient(90deg, transparent, transparent 120px, rgba(255,255,255,0.012) 120px, rgba(255,255,255,0.012) 121px),
          repeating-linear-gradient(0deg, transparent, transparent 120px, rgba(255,255,255,0.012) 120px, rgba(255,255,255,0.012) 121px);
        pointer-events: none;
        z-index: 0;
      }

      /* ── Nav rail ── */
      .gallery-rail {
        position: relative;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 40px;
        border-bottom: 1px solid var(--gold-dim);
        background: linear-gradient(180deg, #1a1508 0%, transparent 100%);
      }
      .museum-wordmark {
        font-family: 'Cormorant Garamond', serif;
        font-size: 1.6rem;
        font-weight: 300;
        letter-spacing: 0.35em;
        color: var(--gold);
        text-transform: uppercase;
        text-decoration: none;
      }
      .museum-wordmark span { font-style: italic; color: var(--cream-dim); }
      #rail-auth {
        display: flex;
        align-items: center;
        gap: 22px;
      }
      .rail-link {
        font-size: 0.68rem;
        letter-spacing: 0.2em;
        color: var(--cream-dim);
        text-transform: uppercase;
        text-decoration: none;
        transition: color 0.2s;
        background: none;
        border: none;
        cursor: pointer;
        font-family: 'Tenor Sans', sans-serif;
        padding: 0;
      }
      .rail-link:hover { color: var(--gold); }
      .rail-username {
        font-size: 0.68rem;
        letter-spacing: 0.2em;
        color: var(--gold);
        text-transform: uppercase;
      }

      /* ── HUD ── */
      #requests-hud {
        position: fixed;
        top: 80px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        background: var(--panel);
        border: 1px solid var(--gold-dim);
        border-top: 2px solid var(--gold);
        padding: 12px 32px;
        text-align: center;
        min-width: 320px;
        backdrop-filter: blur(12px);
        pointer-events: none;
      }
      #hud-title {
        font-family: 'Cormorant Garamond', serif;
        font-size: 0.85rem;
        font-style: italic;
        color: var(--gold);
        letter-spacing: 0.08em;
        margin-bottom: 3px;
      }
      #hud-subtitle {
        font-size: 0.7rem;
        letter-spacing: 0.15em;
        color: var(--cream-dim);
        text-transform: uppercase;
      }

      /* ── Gallery wrapper ── */
      .gallery-wrapper {
        position: relative;
        z-index: 1;
        overflow-x: auto;
        overflow-y: hidden;
        width: 100%;
        padding: 60px 0 80px;
        scrollbar-width: thin;
        scrollbar-color: var(--gold-dim) var(--bg2);
      }
      .gallery-wrapper::-webkit-scrollbar { height: 4px; }
      .gallery-wrapper::-webkit-scrollbar-track { background: var(--bg2); }
      .gallery-wrapper::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 2px; }

      /* ── Hallway ── */
      .hallway {
        display: flex;
        align-items: flex-end;
        gap: 60px;
        padding: 0 80px;
        min-width: max-content;
        position: relative;
      }
      .hallway::after {
        content: '';
        position: absolute;
        bottom: -20px;
        left: 0; right: 0;
        height: 3px;
        background: linear-gradient(90deg, transparent, var(--gold-dim) 10%, var(--gold-dim) 90%, transparent);
      }

      /* ── Commission exhibit ── */
      .exhibit {
        display: flex;
        flex-direction: column;
        align-items: center;
        cursor: pointer;
        transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        position: relative;
      }
      .exhibit:hover { transform: translateY(-8px); }
      .exhibit.active .frame {
        box-shadow:
          0 0 0 1px var(--gold),
          0 0 30px rgba(201, 168, 76, 0.35),
          0 20px 60px var(--shadow);
      }
      .exhibit.done .frame {
        box-shadow:
          0 0 0 1px var(--success),
          0 20px 60px var(--shadow);
      }

      /* ── Frame ── */
      .frame {
        background: var(--frame-outer);
        padding: 14px;
        position: relative;
        box-shadow:
          inset 0 0 0 1px var(--frame-line),
          inset 4px 4px 0 var(--frame-inner),
          inset -4px -4px 0 var(--frame-inner),
          0 15px 50px var(--shadow);
        transition: box-shadow 0.4s ease;
      }
      .frame::before {
        content: '';
        position: absolute;
        inset: 6px;
        border: 1px solid var(--gold-dim);
        pointer-events: none;
        z-index: 1;
      }
      .frame img {
        display: block;
        width: 200px;
        height: 260px;
        object-fit: cover;
        position: relative;
        z-index: 0;
        background: #1a150a;
      }
      .frame .no-img {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 200px;
        height: 260px;
        background: #1a150a;
        font-family: 'Cormorant Garamond', serif;
        font-size: 0.8rem;
        font-style: italic;
        color: var(--gold-dim);
        letter-spacing: 0.1em;
      }

      /* ── Label plate ── */
      .label-plate {
        background: linear-gradient(135deg, #1c1608 0%, #241d0a 100%);
        border: 1px solid var(--gold-dim);
        border-top: 2px solid var(--gold);
        padding: 10px 14px 12px;
        text-align: center;
        width: 100%;
        min-width: 200px;
        margin-top: 12px;
      }
      .exhibit.done .label-plate { border-top-color: var(--success); }
      .label-plate strong {
        display: block;
        font-family: 'Cormorant Garamond', serif;
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--cream);
        letter-spacing: 0.04em;
        line-height: 1.3;
        margin-bottom: 2px;
      }
      .label-plate .plate-artist {
        display: block;
        font-size: 0.65rem;
        letter-spacing: 0.18em;
        color: var(--gold);
        text-transform: uppercase;
        margin-bottom: 6px;
      }
      .label-plate .plate-viewer {
        display: block;
        font-size: 0.62rem;
        letter-spacing: 0.12em;
        color: var(--cream-dim);
        text-transform: uppercase;
        margin-bottom: 2px;
      }
      .label-plate .plate-contact {
        display: block;
        font-size: 0.6rem;
        letter-spacing: 0.08em;
        color: var(--cream-dim);
        opacity: 0.7;
        margin-bottom: 2px;
      }
      .label-plate .plate-budget {
        display: inline-block;
        font-size: 0.62rem;
        letter-spacing: 0.15em;
        color: var(--gold-dim);
        text-transform: uppercase;
        margin-bottom: 8px;
      }
      .status-badge {
        display: inline-block;
        font-size: 0.58rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        padding: 3px 8px;
        border: 1px solid;
        margin-bottom: 10px;
      }
      .badge-pending { color: var(--gold-dim); border-color: var(--gold-dim); }
      .badge-done    { color: var(--success);  border-color: var(--success); }

      .similarity-score {
        display: block;
        font-family: 'Cormorant Garamond', serif;
        font-size: 1.6rem;
        font-weight: 300;
        color: var(--gold);
        letter-spacing: 0.04em;
        line-height: 1;
        margin: 6px 0 2px;
      }
      .similarity-label {
        display: block;
        font-size: 0.55rem;
        letter-spacing: 0.2em;
        color: var(--cream-dim);
        text-transform: uppercase;
        margin-bottom: 8px;
      }

      .mark-done-btn {
        display: inline-block;
        padding: 7px 14px;
        background: transparent;
        border: 1px solid var(--gold-dim);
        color: var(--gold);
        font-family: 'Tenor Sans', sans-serif;
        font-size: 0.6rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.25s ease;
      }
      .mark-done-btn:hover {
        background: var(--gold);
        color: var(--bg);
        border-color: var(--gold);
        box-shadow: 0 0 16px rgba(201, 168, 76, 0.35);
      }

      /* ── Scroll hint ── */
      .scroll-hint {
        position: relative;
        z-index: 2;
        text-align: center;
        font-size: 0.62rem;
        letter-spacing: 0.3em;
        color: var(--gold-dim);
        text-transform: uppercase;
        padding-bottom: 8px;
        animation: fadeHint 3s ease-in-out infinite;
      }
      @keyframes fadeHint {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }

      /* ── Empty / loading ── */
      .loading-msg {
        font-family: 'Cormorant Garamond', serif;
        font-style: italic;
        font-size: 1.2rem;
        color: var(--gold-dim);
        letter-spacing: 0.15em;
        padding: 80px 0;
        text-align: center;
        width: 100%;
      }

      /* ── Modal ── */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(8, 6, 3, 0.85);
        z-index: 200;
        display: none;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(4px);
      }
      .modal-overlay.open { display: flex; }
      .modal-card {
        background: var(--panel);
        border: 1px solid var(--gold-dim);
        border-top: 2px solid var(--gold);
        padding: 40px;
        max-width: 460px;
        width: 90%;
        position: relative;
      }
      .modal-close {
        position: absolute;
        top: 16px; right: 20px;
        background: none;
        border: none;
        color: var(--cream-dim);
        font-size: 1.1rem;
        cursor: pointer;
        line-height: 1;
        transition: color 0.2s;
      }
      .modal-close:hover { color: var(--gold); }
      .modal-title {
        font-family: 'Cormorant Garamond', serif;
        font-size: 1.4rem;
        font-weight: 300;
        letter-spacing: 0.1em;
        color: var(--gold);
        margin-bottom: 6px;
      }
      .modal-subtitle {
        font-size: 0.78rem;
        letter-spacing: 0.08em;
        color: var(--cream-dim);
        margin-bottom: 24px;
        font-style: italic;
        font-family: 'Cormorant Garamond', serif;
      }
      .modal-field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 20px;
      }
      .modal-field label {
        font-size: 0.6rem;
        letter-spacing: 0.22em;
        color: var(--gold-dim);
        text-transform: uppercase;
      }
      .modal-field input[type="file"] {
        background: rgba(255,255,255,0.03);
        border: 1px solid var(--gold-dim);
        color: var(--cream-dim);
        font-family: 'Tenor Sans', sans-serif;
        font-size: 0.78rem;
        padding: 10px 14px;
        cursor: pointer;
        width: 100%;
        outline: none;
        transition: border-color 0.2s;
      }
      .modal-field input[type="file"]:focus { border-color: var(--gold); }

      .modal-status {
        font-size: 0.73rem;
        letter-spacing: 0.1em;
        padding: 10px 12px;
        margin-bottom: 16px;
        display: none;
        line-height: 1.5;
        text-align: center;
      }
      .modal-status.error   { color: var(--err);     border: 1px solid var(--err); }
      .modal-status.loading { color: var(--cream-dim); border: 1px solid var(--gold-dim); }

      .modal-btn {
        width: 100%;
        padding: 13px;
        background: transparent;
        border: 1px solid var(--gold);
        color: var(--gold);
        font-family: 'Tenor Sans', sans-serif;
        font-size: 0.68rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
      }
      .modal-btn::before {
        content: '';
        position: absolute;
        inset: 0;
        background: var(--gold);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.3s ease;
        z-index: 0;
      }
      .modal-btn:hover::before { transform: scaleX(1); }
      .modal-btn:hover { color: var(--bg); }
      .modal-btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .modal-btn span { position: relative; z-index: 1; }
    </style>
  </head>
  <body>

    <nav class="gallery-rail">
      <a class="museum-wordmark" href="gallery.html">Muse<span>Match</span></a>
      <div id="rail-auth"></div>
    </nav>

    <div id="requests-hud">
      <div id="hud-title">Commission Requests</div>
      <div id="hud-subtitle">Loading the studio…</div>
    </div>

    <div class="scroll-hint">← scroll to review →</div>

    <div class="gallery-wrapper">
      <div id="gallery-hallway" class="hallway">
        <div class="loading-msg">Gathering the commissions…</div>
      </div>
    </div>

    <!-- Mark-as-done modal -->
    <div id="done-modal" class="modal-overlay">
      <div class="modal-card">
        <button class="modal-close" id="done-modal-close">&#x2715;</button>
        <div class="modal-title">Mark as Done</div>
        <div class="modal-subtitle" id="done-modal-subtitle"></div>

        <div class="modal-status" id="done-modal-status"></div>

        <div class="modal-field">
          <label for="done-image">Upload completed artwork photo</label>
          <input type="file" id="done-image" accept="image/*" />
        </div>

        <button class="modal-btn" id="done-submit-btn">
          <span>Confirm Complete</span>
        </button>
      </div>
    </div>

    <script src="../JS/auth.js"></script>
    <script>
      // Auth guard — artist only
      (function () {
        const session = Auth.getSession();
        if (!session || session.role !== "artist") {
          window.location.href = "gallery.html";
          return;
        }
        const rail = document.getElementById("rail-auth");
        rail.innerHTML = `
          <a class="rail-link" href="gallery.html">← Gallery</a>
          <span class="rail-username">${session.firstName}</span>
          <button class="rail-link" onclick="Auth.logout()">Sign Out</button>
        `;
      })();

      const API = "http://localhost:3000/api";
      let pendingCompleteId = null;

      async function loadRequests() {
        try {
          const res = await fetch(`${API}/requests`);
          const requests = await res.json();

          const hallway = document.getElementById("gallery-hallway");
          const hudSub  = document.getElementById("hud-subtitle");

          if (!requests.length) {
            hallway.innerHTML = '<div class="loading-msg">No commissions yet.</div>';
            hudSub.textContent = "No requests in the studio";
            return;
          }

          const sorted = [...requests].sort((a, b) => new Date(b.requestedAt) - new Date(a.requestedAt));
          const pending = sorted.filter(r => r.status === "pending").length;
          hudSub.textContent = `${sorted.length} total · ${pending} pending`;

          hallway.innerHTML = "";
          sorted.forEach(r => {
            const isDone = r.status === "completed";
            const imgSrc = isDone && r.completedImagePath
              ? r.completedImagePath
              : (r.artwork.imageId
                  ? `https://www.artic.edu/iiif/2/${r.artwork.imageId}/full/,300/0/default.jpg`
                  : null);

            const imgHtml = imgSrc
              ? `<img src="${imgSrc}" alt="${r.artwork.title}" loading="lazy">`
              : `<div class="no-img">No image</div>`;

            const badge = isDone
              ? `<span class="status-badge badge-done">Done</span>`
              : `<span class="status-badge badge-pending">Pending</span>`;

            const actionBtn = !isDone
              ? `<button class="mark-done-btn" data-id="${r.id}">Mark as Done</button>`
              : "";

            const exhibit = document.createElement("div");
            exhibit.className = `exhibit${isDone ? " done" : ""}`;
            exhibit.innerHTML = `
              <div class="frame">${imgHtml}</div>
              <div class="label-plate">
                <strong>${r.artwork.title}</strong>
                <span class="plate-artist">${r.artwork.artist || "Unknown"}</span>
                <span class="plate-viewer">${r.viewer.firstName} ${r.viewer.lastName}</span>
                <span class="plate-contact">${r.viewer.email}</span>
                <span class="plate-contact">${r.viewer.phone || "—"}</span>
                <span class="plate-budget">Budget: $${r.budget}</span><br>
                ${badge}
                ${isDone && r.similarityScore != null
                  ? `<span class="similarity-score">${r.similarityScore}%</span><span class="similarity-label">Similarity to original</span>`
                  : ""}
                ${actionBtn}
              </div>
            `;

            hallway.appendChild(exhibit);
          });

          document.querySelectorAll(".mark-done-btn").forEach(btn => {
            btn.addEventListener("click", () => {
              const title = btn.closest(".label-plate").querySelector("strong").textContent;
              openModal(btn.dataset.id, title);
            });
          });

          setupProximityDetection();
        } catch (err) {
          console.error(err);
          document.getElementById("gallery-hallway").innerHTML =
            '<div class="loading-msg">Could not load requests.</div>';
        }
      }

      function setupProximityDetection() {
        const exhibits = document.querySelectorAll(".exhibit");
        const hud = document.getElementById("hud-title");
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              exhibits.forEach(el => el.classList.remove("active"));
              entry.target.classList.add("active");
              const plate = entry.target.querySelector("strong");
              if (plate) hud.textContent = `"${plate.textContent}"`;
            }
          });
        }, {
          root: document.querySelector(".gallery-wrapper"),
          rootMargin: "0px -35% 0px -35%",
          threshold: 0.5
        });
        exhibits.forEach(ex => observer.observe(ex));
      }

      function openModal(id, title) {
        pendingCompleteId = id;
        document.getElementById("done-modal-subtitle").textContent = `"${title}"`;
        document.getElementById("done-image").value = "";
        document.getElementById("done-submit-btn").disabled = false;
        setModalStatus("", "");
        document.getElementById("done-modal").classList.add("open");
      }

      function closeModal() {
        document.getElementById("done-modal").classList.remove("open");
        pendingCompleteId = null;
      }

      function setModalStatus(msg, type) {
        const el = document.getElementById("done-modal-status");
        el.textContent = msg;
        el.className = "modal-status" + (type ? " " + type : "");
        el.style.display = msg ? "block" : "none";
      }

      document.getElementById("done-modal-close").addEventListener("click", closeModal);
      document.getElementById("done-modal").addEventListener("click", e => {
        if (e.target === document.getElementById("done-modal")) closeModal();
      });

      document.getElementById("done-submit-btn").addEventListener("click", async () => {
        if (!pendingCompleteId) return;
        const btn = document.getElementById("done-submit-btn");
        const fileInput = document.getElementById("done-image");

        btn.disabled = true;
        setModalStatus("Submitting…", "loading");

        const formData = new FormData();
        if (fileInput.files[0]) formData.append("completedImage", fileInput.files[0]);

        try {
          const res = await fetch(`${API}/requests/${pendingCompleteId}/complete`, {
            method: "POST",
            body: formData,
          });
          const data = await res.json();
          if (!res.ok) {
            setModalStatus(data.error || "Request failed.", "error");
            btn.disabled = false;
            return;
          }
          closeModal();
          loadRequests();
        } catch {
          setModalStatus("Could not connect to the server.", "error");
          btn.disabled = false;
        }
      });

      loadRequests();
    </script>

  </body>
</html>
