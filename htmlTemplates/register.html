<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register — MuseMatch</title>
    <link rel="stylesheet" href="../CSS/styles.css" />
  </head>
  <body class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">
        <h1>MuseMatch</h1>
        <p>Create your gallery account</p>
      </div>

      <form action="#" method="post">
        <div class="form-group">
          <label for="firstName">First Name</label>
          <input type="text" id="firstName" name="firstName" placeholder="Jane" required />
        </div>

        <div class="form-group">
          <label for="lastName">Last Name</label>
          <input type="text" id="lastName" name="lastName" placeholder="Doe" required />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required />
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required />
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="showPassword" />
          <label for="showPassword">Show passwords</label>
        </div>

        <button type="submit" class="auth-submit">Create Account</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
    </div>

    <script>
      const showPasswordCheckbox = document.getElementById("showPassword");
      const passwordField = document.getElementById("password");
      const confirmPasswordField = document.getElementById("confirmPassword");

      showPasswordCheckbox.addEventListener("change", function () {
        const type = this.checked ? "text" : "password";
        passwordField.type = type;
        confirmPasswordField.type = type;
      });
    </script>
  </body>
</html>
