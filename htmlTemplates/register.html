<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register — MuseMatch</title>
    <link rel="stylesheet" href="../CSS/styles.css" />
  </head>
  <body class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">
        <h1>MuseMatch</h1>
        <p>Create your gallery account</p>
      </div>

      <form id="register-form">
        <div id="auth-error" class="auth-error" style="display:none;"></div>
        <div class="form-group">
          <label for="firstName">First Name</label>
          <input type="text" id="firstName" name="firstName" placeholder="Jane" required />
        </div>

        <div class="form-group">
          <label for="lastName">Last Name</label>
          <input type="text" id="lastName" name="lastName" placeholder="Doe" required />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required />
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required />
        </div>

        <div class="form-group">
          <label>I am a…</label>
          <div class="role-group">
            <label class="role-option">
              <input type="radio" name="role" value="viewer" checked />
              <span>Viewer</span>
            </label>
            <label class="role-option">
              <input type="radio" name="role" value="artist" />
              <span>Artist</span>
            </label>
          </div>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="showPassword" />
          <label for="showPassword">Show passwords</label>
        </div>

        <button type="submit" class="auth-submit">Create Account</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
    </div>

    <script src="../JS/auth.js"></script>
    <script>
      document.getElementById("showPassword").addEventListener("change", function () {
        const type = this.checked ? "text" : "password";
        document.getElementById("password").type = type;
        document.getElementById("confirmPassword").type = type;
      });

      document.getElementById("register-form").addEventListener("submit", async function (e) {
        e.preventDefault();
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        const errorEl = document.getElementById("auth-error");

        if (password !== confirmPassword) {
          errorEl.textContent = "Passwords do not match.";
          errorEl.style.display = "block";
          return;
        }

        const role = document.querySelector('input[name="role"]:checked').value;

        const result = await Auth.register(
          document.getElementById("firstName").value,
          document.getElementById("lastName").value,
          document.getElementById("email").value,
          document.getElementById("phone").value,
          password,
          role
        );

        if (result.success) {
          window.location.href = "login.html";
        } else {
          errorEl.textContent = result.error;
          errorEl.style.display = "block";
        }
      });
    </script>
  </body>
</html>
